name: WinGet Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v1.0.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  submit:
    if: github.repository == 'SteveTheKiller/KillerBench' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Install verified Komac
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest 'https://github.com/russellbanks/Komac/releases/download/v2.17.2/komac-2.17.2-x86_64-pc-windows-msvc.exe' -OutFile $path
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne '38A5A53B2291E959157A46A9ED2F20C1C66E9E238666780519650FCC8D37AD58') { throw 'Komac hash verification failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:RUNNER_TEMP
      - name: Submit published installer to WinGet
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if (-not $env:GITHUB_TOKEN) { throw 'WINGET_TOKEN is not configured.' }
          if ($env:EVENT_NAME -eq 'release') { Start-Sleep -Seconds 90 }
          ./Packaging/Submit-Distribution.ps1 -Channel WinGet -ReleaseTag $env:RELEASE_TAG -OutputDirectory (Join-Path $env:RUNNER_TEMP 'winget-submission') -Submit
